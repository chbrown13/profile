# Basic configuration checks for the "CS5704: Software Engineering" course at Virginia Tech taught by Dr. Chris Brown. Based on configurations by Dr. Chris Parnin.

- group:
    description: "Essential development tools"
    checks:
      - version:
         cmd: git --version
         range: ^2.x.x

      - version:
         cmd: docker -v
         range: ^19.x.x
         
      - version:
         cmd: npm -v
         range: ^9.x.x

- group:
   description: "Git configuration"
   checks:
     - contains: 
         comment: Checking email is set for git commits
         string: "@"
         file: ~/.gitconfig       
     - command:     
         exec: git config --global --get user.name
         stdout: "[a-zA-Z0-9_]+"
     - command:
         exec: git config --global --get user.email
         stdout: "[a-zA-Z0-9_@]+"

- group:
   description: "Docker configuration"
   checks:      
      - version:
         cmd: docker compose version
         range: ^2.x.x
   
      - contains:
         comment: Checking docker labspace extension is installed
         string: "dockersamples/labspace-extension"
         cmd: docker extension ls